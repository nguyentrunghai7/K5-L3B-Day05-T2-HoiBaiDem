<!doctype html>
<html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hỏi bài đêm · Buổi 3</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f4ee;color:#1c2e27;font:16px/1.55 "Segoe UI",sans-serif}header{background:#16392e;color:#fff;padding:20px max(24px,calc((100% - 960px)/2));white-space:nowrap}main{max-width:1000px;margin:38px auto;padding:0 20px}h1{font:48px "Segoe UI";margin:0 0 8px}h2{font:26px "Segoe UI";margin:0 0 12px}p{margin:0 0 14px}.muted{color:#52635b}.grid{display:grid;grid-template-columns:1fr 290px;gap:20px;margin-top:25px}section,aside{background:white;border:1px solid #d6ddd4;border-radius:15px;padding:24px}aside{align-self:start}blockquote{margin:0 0 20px;background:#edf4ed;padding:14px;border-radius:8px}details{padding:12px;background:#fbf4e4;border-radius:8px;margin:12px 0}summary{cursor:pointer;font-weight:600}button{border:1px solid #1c513e;background:#1c513e;color:white;border-radius:8px;padding:10px 14px;font:inherit;cursor:pointer;margin:4px 6px 4px 0}button.alt{background:white;color:#1c513e}button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #b06524;outline-offset:2px}select{width:100%;font:inherit;padding:8px;margin:6px 0 14px}small{display:block}.badge{display:inline-block;background:#e6efe4;padding:3px 9px;border-radius:20px;margin-bottom:10px}.mark{display:none}.annotated .mark{display:inline;background:#ffdf8c;border:1px solid #66480c;border-radius:50%;padding:0 5px;color:#222}@media(max-width:700px){.grid{grid-template-columns:1fr}h1{font-size:37px}header{white-space:normal}}
</style>
<header>Nhập môn phân tích dữ liệu / Buổi 3</header>
<main><h1>Hỏi bài đêm</h1><p class="muted">22:15 · 13/11/2026 · Dữ liệu mô phỏng</p>
<div class="grid"><section aria-live="polite" id="panel"></section><aside><h2>Đổi tình huống</h2><label for="scenario">Tin nhắn mẫu</label><select id="scenario"><option value="source">Tài liệu có câu sai</option><option value="open">Xin xác nhận đáp số bài 3</option><option value="normal">Hỏi về trung vị</option></select><p class="muted">TA trực 08:00–22:00. Các thao tác gửi và thu hồi chỉ chạy trong bản demo.</p></aside></div></main>
<script>
const panel=document.querySelector('#panel'), scenario=document.querySelector('#scenario');
const params=new URLSearchParams(location.search);
if(params.has('annotated')) document.body.classList.add('annotated');
let state=params.has('review')?'review':'answer';
const mark=n=>'<span class="mark" aria-hidden="true">'+n+'</span>';
const questions={source:'§3.3 nói độ lệch chuẩn luôn nhỏ hơn phương sai. Sao máy tính của em lại ra lớn hơn?',open:'Em tính ra một đáp số cho bài 3. Anh xác nhận giúp em đúng không?',normal:'Trung vị là gì, có khác trung bình không?'};
const report='Buổi 3, §3.3: câu “độ lệch chuẩn luôn nhỏ hơn phương sai” cần kiểm tra. Ví dụ phương sai 0,25 thì căn bậc hai là 0,5.';
function render(){
const selected=scenario.value;
let body;
if(selected==='source'){
if(state==='review') body='<h2>Xem trước nội dung gửi TA '+mark(3)+'</h2><blockquote>'+report+'</blockquote><p>TA sẽ thấy đoạn cần kiểm tra và ví dụ trên. Tin nhắn riêng của bạn không nằm trong phiếu. Ca trực kế tiếp bắt đầu lúc 08:00 ngày 14/11.</p><button data-next="sent">Xác nhận gửi mô phỏng</button><button class="alt" data-next="answer">Quay lại</button>';
else if(state==='sent') body='<h2>Phiếu đang chờ TA (mô phỏng)</h2><p>TA xem khi vào ca tiếp theo, từ 08:00 ngày 14/11. Chưa có giờ trả lời cụ thể.</p><button class="alt" data-next="withdrawn">Thu hồi phiếu mô phỏng</button>';
else body='<span class="badge">Cần kiểm tra tài liệu '+mark(1)+'</span><h2>Câu này trong tài liệu cần xem lại</h2><p>Nếu phương sai là 0,25 thì độ lệch chuẩn là 0,5. Kết quả đó lớn hơn 0,25, nên câu “luôn nhỏ hơn” ở §3.3 cần được kiểm tra. Bạn vẫn có thể dùng quy tắc lấy căn bậc hai để làm bước tính.</p><details open><summary>Căn cứ · Buổi 3, §3.3 '+mark(2)+'</summary><p>“Độ lệch chuẩn là căn bậc hai của phương sai, có cùng đơn vị với dữ liệu.”</p></details>'+(state==='withdrawn'?'<p>Đã thu hồi phiếu mô phỏng.</p>':'')+'<button data-next="review">Xem phiếu báo TA</button>';
}else if(selected==='open') body='<span class="badge">Bài 3 đang mở</span><h2>Kiểm tra bước làm</h2><p>Bài 3 còn mở đến 23:59 hôm nay. Mình có thể giúp bạn kiểm tra cách tìm trung vị. Bạn đã sắp dãy lương và xác định hai vị trí giữa chưa?</p><details><summary>Căn cứ · §3.2, §3.5 và trang khóa học</summary><p>Với số phần tử chẵn, lấy trung bình hai giá trị ở giữa sau khi sắp xếp.</p></details>';
else body='<h2>Trung vị là giá trị ở giữa</h2><p>Hãy sắp dữ liệu từ nhỏ đến lớn. Nếu có hai giá trị ở giữa, lấy trung bình của chúng. Trung vị ít bị kéo bởi một giá trị quá lớn hoặc quá nhỏ.</p><details><summary>Căn cứ · Buổi 3, §3.1–§3.2</summary><p>Trung bình cộng dùng tổng và số lượng giá trị. Trung vị dựa vào vị trí giữa trong dãy đã sắp xếp.</p></details>';
panel.innerHTML='<small class="muted">Học viên</small><blockquote>'+questions[selected]+'</blockquote>'+body;
}
panel.addEventListener('click',e=>{if(e.target.dataset.next){state=e.target.dataset.next;render();panel.querySelector('h2').tabIndex=-1;panel.querySelector('h2').focus();}});
scenario.addEventListener('change',()=>{render()});
render();
</script></html>
